services:
  backend-ai:
    build:
      context: ./backend-ai
    environment:
      AI_BACKEND_SHARED_SECRET: ${AI_BACKEND_SHARED_SECRET:?Set AI_BACKEND_SHARED_SECRET in .env}
      DATABASE_URI: ${DATABASE_URI:?Set DATABASE_URI in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in .env}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend-ai:
        condition: service_healthy
    environment:
      AI_BACKEND_SHARED_SECRET: ${AI_BACKEND_SHARED_SECRET:?Set AI_BACKEND_SHARED_SECRET in .env}
      AI_BACKEND_URL: http://backend-ai:8000
      AUTH_EMAIL_WEBHOOK_SECRET: ${AUTH_EMAIL_WEBHOOK_SECRET:-}
      AUTH_EMAIL_WEBHOOK_URL: ${AUTH_EMAIL_WEBHOOK_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATABASE_URI: ${DATABASE_URI:?Set DATABASE_URI in .env}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
